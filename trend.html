  } else if(S.pivot==="rootcause"){
    out+=pivHeader("Root Cause × Issue Type",[],"Ticket count by root cause, split by issue type.");
    out+=pivot2D("rootcause","Root Cause","#B45309",pool,function(t){return t.rc||"(blank)";},"Root Cause",issueColDefs(pool),function(t){return t.issue||"(blank)";});
    var rcM=cnt(pool,function(t){return t.rc||"(blank)";}), trc=topKey(rcM,true);
    var incN=pool.filter(function(t){return t.issue==="Incident";}).length, srN=pool.filter(function(t){return t.issue==="Service Request";}).length;
    out+=note([
      trc?('Top root cause: <b>'+esc(trc)+'</b> with <b>'+rcM[trc].toLocaleString()+'</b> tickets ('+pct(rcM[trc],pool.length)+'% of all).'):null,
      'Incidents <b>'+incN.toLocaleString()+'</b> vs Service Requests <b>'+srN.toLocaleString()+'</b> ('+pct(incN,pool.length)+'% / '+pct(srN,pool.length)+'%).',
      (rcM["(blank)"]?('<b class="dn">'+rcM["(blank)"]+'</b> tickets have no root cause — see the Exceptions tab.'):null)
    ]);
  } else if(S.pivot==="component"){
    out+=pivHeader("Component × Issue Type",[],"Ticket count by component, split by issue type.");
    out+=pivot2D("component","Component","#0F766E",pool,function(t){return t.components||"(blank)";},"Components",issueColDefs(pool),function(t){return t.issue||"(blank)";});
    var cM=cnt(pool,function(t){return t.components||"(blank)";}), tc=topKey(cM,true);
    out+=note([
      tc?('Top component: <b>'+esc(tc)+'</b> with <b>'+cM[tc].toLocaleString()+'</b> tickets.'):null,
      (cM["(blank)"]?('<b class="dn">'+cM["(blank)"]+'</b> tickets have no component — see the Exceptions tab.'):'Every ticket has a component assigned.')
    ]);
  } else if(S.pivot==="svm"){
    out+=pivHeader("SVM In Charge × Issue Type",[],"Ticket count by SVM In Charge, split by issue type.");
    out+=pivot2D("svm","SVM In Charge","#5B57D8",pool,function(t){return t.svm||"(blank)";},"SVM In Charge",issueColDefs(pool),function(t){return t.issue||"(blank)";});
    var sM=cnt(pool,function(t){return t.svm||"(blank)";}), ts=topKey(sM,true);
    out+=note([
      ts?('Highest volume: <b>'+esc(ts)+'</b> owns <b>'+sM[ts].toLocaleString()+'</b> tickets ('+pct(sM[ts],pool.length)+'%).'):null,
      (sM["(blank)"]?('<b class="dn">'+sM["(blank)"]+'</b> tickets have no SVM In Charge — see the Exceptions tab.'):null)
    ]);
  } else if(S.pivot==="custom"){
    var CROW_FIELDS=["Current Worker","Project","Priority","Issue Type","Root Cause","Components","SVM In Charge","Type of Fix","Screen Name","Menu Head","Status"];
    var CCOL_FIELDS=["HD/Engg Split","Status","Priority","Issue Type","Root Cause","Type of Fix","Components"];
    if(!S.cpRow) S.cpRow="Current Worker";
    if(!S.cpCol) S.cpCol="Root Cause";
    var cpRowFn=function(t){
      var f=S.cpRow;
      if(f==="Current Worker")return t.currentWorker||"(blank)";if(f==="Project")return t.project||"(blank)";if(f==="Priority")return t.priority||"(blank)";if(f==="Issue Type")return t.issue||"(blank)";if(f==="Root Cause")return t.rc||"(blank)";if(f==="SVM In Charge")return t.svm||"(blank)";if(f==="Status")return t.status||"(blank)";if(f==="Components")return t.components||"(blank)";if(f==="Type of Fix")return t.typeOfFix||"(blank)";if(f==="Screen Name")return t.screenName||"(blank)";if(f==="Menu Head")return t.menuHead||"(blank)";
      return "(blank)";
    };
    var cpColVals=new Set();var cpColFn;
    if(S.cpCol==="HD/Engg Split"){cpColFn=function(t){return t.isHD?"HD":"ENGG";};cpColVals.add("HD");cpColVals.add("ENGG");}
    else{cpColFn=function(t){var f=S.cpCol;if(f==="Status")return t.status||"(blank)";if(f==="Priority")return t.priority||"(blank)";if(f==="Issue Type")return t.issue||"(blank)";if(f==="Root Cause")return t.rc||"(blank)";if(f==="Type of Fix")return t.typeOfFix||"(blank)";if(f==="Components")return t.components||"(blank)";return"(blank)";};pool.forEach(function(t){cpColVals.add(cpColFn(t));});}
    var cpCols=[...cpColVals].sort().map(function(c){return{key:c,label:c};});
    out+=pivHeader("Custom Pivot",[chip("Rows",S.cpRow),chip("Columns",S.cpCol)],"Build your own cross-tab by choosing row and column fields.");
    out+='<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px">'+
      '<span class="flabel">Rows</span><select class="fsel" id="cpRow">'+CROW_FIELDS.map(function(f){return '<option value="'+esc(f)+'" '+(S.cpRow===f?"selected":"")+'>'+esc(f)+'</option>';}).join("")+'</select>'+
      '<span class="flabel">Columns</span><select class="fsel" id="cpCol">'+CCOL_FIELDS.map(function(f){return '<option value="'+esc(f)+'" '+(S.cpCol===f?"selected":"")+'>'+esc(f)+'</option>';}).join("")+'</select>'+
    '</div>';
    out+=pivot2D("custom","Custom Pivot","#2563EB",pool,cpRowFn,S.cpRow,cpCols,cpColFn);
  }
  out+='</div>';
  return out;
}

/* ═══════════════════════════════ VIEW: WEEK ON WEEK ═══════════════════════════════ */
function wowCard(label,a,b,isPct,color,metric){
  var d=b-a, arrow=d>0?"▲":(d<0?"▼":"→"), cls=d>0?"up":(d<0?"down":"flat");
  return '<div class="card kpi clk" data-wcard="'+metric+'" style="text-align:center;padding:16px 14px">'+
    '<div class="kl">'+label+'</div>'+
    '<div class="kv" style="color:'+color+';font-size:25px;margin-top:8px">'+b+(isPct?"%":"")+'</div>'+
    '<div style="margin-top:9px"><span class="dchip '+cls+'">'+arrow+' '+Math.abs(d)+(isPct?" pts":"")+'</span> <span class="sub">vs '+a+(isPct?"%":"")+'</span></div>'+
  '</div>';
}
function deltaCell(d,isPct,neg){
  if(d===null||d===undefined) return '<span class="sub">—</span>';
  var good=neg?-d:d, cls=good>0?"up":(good<0?"down":"flat"), sym=d>0?"▲":(d<0?"▼":"→");
  return '<span class="dchip '+cls+'">'+sym+' '+Math.abs(d)+(isPct?" pts":"")+'</span>';
}
function viewWoW(){
  window.__piv={};
  var pool=weekPool();
  var scopeNote=(S.svm||S.cw||S.rc||S.issue)?" (filters applied)":"";
  var out='<div class="up" style="margin-bottom:14px"><div class="eyebrow">Week on Week</div>'+
    '<h1 style="font-size:23px;font-weight:700;letter-spacing:-.4px;margin-top:4px">Week-on-week resolution</h1>'+
    '<div class="sub" style="margin-top:3px">ISO week numbers built from each ticket\'s <b>Resolved date</b>. Pick two weeks below — that window drives every chart, table and pivot on this tab'+esc(scopeNote)+'.</div></div>';
  if(!pool.length){ return out+'<div class="card pad"><div class="empty">No resolved tickets in scope. Week-on-week uses the Resolved date — try clearing filters or the date range.</div></div>'; }

  function fk(d){ var iw=isoWeek(d); return iw.year+"-W"+String(iw.week).padStart(2,"0"); }
  var wk={};
  pool.forEach(function(t){ var key=fk(t.resolved);
    if(!wk[key]) wk[key]={key:key,year:isoWeek(t.resolved).year,week:isoWeek(t.resolved).week,tix:[],hd:0,eg:0};
    wk[key].tix.push(t); if(t.isHD)wk[key].hd++; else wk[key].eg++; });
  var keys=Object.keys(wk).sort();
  window.__wk=wk;
  if(!S.weekB||!wk[S.weekB]) S.weekB=keys[keys.length-1];
  if(!S.weekA||!wk[S.weekA]) S.weekA=keys.length>1?keys[keys.length-2]:keys[keys.length-1];

  // the two selectors define an inclusive window
  var lo=S.weekA<=S.weekB?S.weekA:S.weekB, hi=S.weekA<=S.weekB?S.weekB:S.weekA;
  var vis=keys.filter(function(k){ return k>=lo && k<=hi; });
  var poolR=pool.filter(function(t){ var k=fk(t.resolved); return k>=lo && k<=hi; });
  var allSelected=(vis.length===keys.length);

  function m(k){ var w=wk[k]; return {t:w.tix.length,hd:w.hd,eg:w.eg,hp:pct(w.hd,w.tix.length)}; }
  var A=m(S.weekA), B=m(S.weekB);

  var latest=keys[keys.length-1];
  var windowTxt = vis.length===1 ? ('Showing <b>'+weekLabel(vis[0])+'</b>') : ('Showing <b>'+weekLabel(lo)+'</b>–<b>'+weekLabel(hi)+'</b> · '+vis.length+' weeks');
  out+='<div class="card up d1 pad" style="margin-bottom:14px">'+
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">'+
      '<span class="sec-title">Compare weeks</span>'+
      '<select class="fsel" id="weekA">'+keys.map(function(k){return '<option value="'+k+'" '+(S.weekA===k?"selected":"")+'>'+weekLabel(k)+' · '+weekDates(wk[k].year,wk[k].week)+'</option>';}).join("")+'</select>'+
      '<span class="sub">→</span>'+
      '<select class="fsel" id="weekB">'+keys.map(function(k){return '<option value="'+k+'" '+(S.weekB===k?"selected":"")+'>'+weekLabel(k)+' · '+weekDates(wk[k].year,wk[k].week)+'</option>';}).join("")+'</select>'+
      '<button class="chip'+(vis.length===2&&hi===latest?' on':'')+'" data-wowset="last2">Last 2 weeks</button>'+
      '<button class="chip'+(allSelected?' on':'')+'" data-wowset="all">All weeks</button>'+
      '<span class="click" style="margin-left:auto">'+windowTxt+' · click a metric to open tickets</span>'+
    '</div>'+
    '<div class="grid" style="grid-template-columns:repeat(4,1fr)">'+
      wowCard("Resolved",A.t,B.t,false,"var(--ink)","all")+
      wowCard("HD resolved",A.hd,B.hd,false,"var(--hd)","hd")+
      wowCard("Engg resolved",A.eg,B.eg,false,"var(--engg)","eg")+
      wowCard("HD share",A.hp,B.hp,true,"var(--hd)","hp")+
    '</div>'+
    note([
      'From <b>'+weekLabel(S.weekA)+'</b> to <b>'+weekLabel(S.weekB)+'</b>, resolved '+((B.t-A.t)>=0?'rose':'fell')+' by <b>'+Math.abs(B.t-A.t)+'</b> ('+(A.t?Math.round((B.t-A.t)/A.t*100):0)+'%).',
      'HD share moved <b class="'+((B.hp-A.hp)>=0?'up':'dn')+'">'+arrow(B.hp-A.hp)+' '+Math.abs(B.hp-A.hp)+' pts</b> ('+A.hp+'% → '+B.hp+'%).'
    ])+
  '</div>';

  // trend bars — visible window only
  var maxT=1; vis.forEach(function(k){ maxT=Math.max(maxT,wk[k].tix.length); });
  var BAR=200;
  out+='<div class="card up d2 pad" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px"><span class="sec-title">Resolved per week — HD vs Engg</span><span class="click">'+(allSelected?"all weeks":weekLabel(lo)+"–"+weekLabel(hi))+' · click a segment</span></div><div class="stackwrap">';
  vis.forEach(function(k){ var w=wk[k]; var tot=w.tix.length; var hpx=Math.max(Math.round(tot/maxT*BAR),10);
    out+='<div class="col"><div class="tot">'+tot+'</div><div class="stack" style="height:'+hpx+'px">'+
      (w.eg>0?'<div class="seg engg" data-wk="'+k+'" data-side="eg" style="flex:'+w.eg+' '+w.eg+' 0" title="Engg '+w.eg+'">'+(w.eg/tot*hpx>=16?'<span class="sv">'+w.eg+'</span>':'')+'</div>':'')+
      (w.hd>0?'<div class="seg hd" data-wk="'+k+'" data-side="hd" style="flex:'+w.hd+' '+w.hd+' 0" title="HD '+w.hd+'">'+(w.hd/tot*hpx>=16?'<span class="sv">'+w.hd+'</span>':'')+'</div>':'')+
    '</div><div class="wx">'+weekLabel(k)+'<br>'+weekDates(w.year,w.week)+'</div></div>';
  });
  out+='</div><div class="legend" style="margin-top:14px"><span class="li"><span class="sw" style="background:var(--hd)"></span>HD resolved</span><span class="li"><span class="sw" style="background:var(--engg)"></span>Engg resolved</span></div>'+
    (function(){ var sum=vis.reduce(function(a,k){return a+wk[k].tix.length;},0);
      var busiest=vis.reduce(function(a,b){return wk[b].tix.length>wk[a].tix.length?b:a;});
      var lat=wk[vis[vis.length-1]];
      return note([
        'Window of <b>'+vis.length+'</b> week'+(vis.length!==1?'s':'')+' — <b>'+sum.toLocaleString()+'</b> resolved, averaging <b>'+Math.round(sum/vis.length)+'</b>/week.',
        'Busiest in window: <b>'+weekLabel(busiest)+'</b> ('+weekDates(wk[busiest].year,wk[busiest].week)+') with <b>'+wk[busiest].tix.length+'</b> resolved.',
        'Newest week <b>'+weekLabel(lat.key)+'</b> — HD share <b class="hd">'+pct(lat.hd,lat.tix.length)+'%</b> ('+lat.hd+' HD / '+lat.eg+' Engg).'
      ]); })()+
  '</div>';

  // detail table with deltas — visible window
  out+='<div class="card up d3" style="overflow:hidden;margin-bottom:14px"><div class="pad" style="border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><span class="sec-title">Week detail &amp; change vs previous week</span><span class="click">click a row, or an HD / Engg cell</span></div>'+
    '<div style="overflow:auto;max-height:460px"><table class="ptable"><thead><tr><th class="rh">Week</th><th class="rh">Dates</th><th>Resolved</th><th>HD</th><th>Engg</th><th>HD %</th><th>Engg %</th><th>Δ Resolved</th><th>Δ HD %</th><th>Δ Engg %</th></tr></thead><tbody>';
  vis.forEach(function(k,i){ var w=wk[k]; var tot=w.tix.length; var hp=pct(w.hd,tot);
    var prev=i>0?wk[vis[i-1]]:null; var dTot=prev?tot-prev.tix.length:null; var dHp=prev?hp-pct(prev.hd,prev.tix.length):null;
    out+='<tr class="rowlink" data-wk-row="'+k+'"><td class="rl">'+weekLabel(k)+'</td>'+
      '<td class="rl" style="font-weight:400;color:var(--muted)">'+weekDates(w.year,w.week)+'</td>'+
      '<td class="tot val" data-wkc="'+k+'" data-side="all">'+tot+'</td>'+
      '<td class="val" data-wkc="'+k+'" data-side="hd" style="color:var(--hd);font-weight:700">'+w.hd+'</td>'+
      '<td class="val" data-wkc="'+k+'" data-side="eg" style="color:var(--engg);font-weight:700">'+w.eg+'</td>'+
      '<td class="mono">'+hp+'%</td>'+
      '<td class="mono" style="color:var(--engg)">'+(100-hp)+'%</td>'+
      '<td>'+deltaCell(dTot,false)+'</td><td>'+deltaCell(dHp,true)+'</td>'+
      '<td>'+deltaCell(dHp===null?null:-dHp,true,true)+'</td></tr>';
  });
  out+='</tbody></table></div>'+
    (function(){ if(vis.length<2) return ""; var jumps=[]; for(var i=1;i<vis.length;i++){ jumps.push({k:vis[i],d:wk[vis[i]].tix.length-wk[vis[i-1]].tix.length}); }
      var up=jumps.reduce(function(a,b){return b.d>a.d?b:a;}), dn=jumps.reduce(function(a,b){return b.d<a.d?b:a;});
      return note([
        'Biggest week-over-week rise: <b class="up">'+weekLabel(up.k)+' (+'+up.d+')</b> vs the prior week.',
        'Biggest drop: <b class="dn">'+weekLabel(dn.k)+' ('+dn.d+')</b> vs the prior week.'
      ]); })()+
  '</div>';

  // pivots — visible window
  out+='<div class="card up d4 pad" style="margin-bottom:14px">'+pivHeader("Week × Solved",[chip("Window",allSelected?"all weeks":weekLabel(lo)+"–"+weekLabel(hi))],"Resolved tickets per ISO week, split HD vs Engg.")+
    pivot2D("wkhd","Week × Solved","#0F766E",poolR,function(t){return weekKeyLabel(t.resolved);},"Week",[{key:"HD",label:"HD"},{key:"ENGG",label:"ENGG"}],function(t){return t.isHD?"HD":"ENGG";})+
    (function(){ var bh=null,bl=null; vis.forEach(function(k){ var p=pct(wk[k].hd,wk[k].tix.length); if(bh===null||p>pct(wk[bh].hd,wk[bh].tix.length))bh=k; if(bl===null||p<pct(wk[bl].hd,wk[bl].tix.length))bl=k; });
      return note([ hdSentence(poolR),
        (bh&&bl&&bh!==bl)?('Highest HD-share week: <b class="hd">'+weekLabel(bh)+' ('+pct(wk[bh].hd,wk[bh].tix.length)+'%)</b>; lowest: <b class="dn">'+weekLabel(bl)+' ('+pct(wk[bl].hd,wk[bl].tix.length)+'%)</b>.'):null ]); })()+
  '</div>';
  var gAll=cnt(poolR,function(t){return t.group;}), tgAll=topKey(gAll);
  out+='<div class="card up d4 pad">'+pivHeader("Week × Group",[chip("Window",allSelected?"all weeks":weekLabel(lo)+"–"+weekLabel(hi))],"Resolved tickets per ISO week across Group 1 / Group 2 / Others.")+
    pivot2D("wkgroup","Week × Group","#5B57D8",poolR,function(t){return weekKeyLabel(t.resolved);},"Week",GROUP_ORDER.map(function(g){return {key:g,label:g};}),function(t){return t.group;})+
    note([ 'Resolved by group — <b>Group 1</b> '+(gAll["Group 1"]||0)+' ('+pct(gAll["Group 1"]||0,poolR.length)+'%), <b>Group 2</b> '+(gAll["Group 2"]||0)+' ('+pct(gAll["Group 2"]||0,poolR.length)+'%), <b>Others</b> '+(gAll["Others"]||0)+' ('+pct(gAll["Others"]||0,poolR.length)+'%).', tgAll?('Most resolved: <b>'+esc(tgAll)+'</b>.'):null ])+
    groupLegend()+'</div>';
  return out;
}

/* ═══════════════════════════════ BIND events per tab ═══════════════════════════════ */
function bindPivotCells(){
  // generic 2-D pivot cells (used by Pivots tab and Week-on-Week pivots)
  document.querySelectorAll('.ptable td.val[data-piv]').forEach(function(td){
    if(td.classList.contains("zero")) return;
    td.onclick=function(){
      var reg=window.__piv[td.dataset.piv]; if(!reg) return;
      var r=td.dataset.r, c=td.dataset.c;
      var sub=reg.tickets.filter(function(t){ return (r==="__all__"||reg.rowKeyFn(t)===r) && (c==="__all__"||reg.colKeyFn(t)===c); });
      var title=reg.title+" — "+(r==="__all__"?"All rows":r)+(c==="__all__"?"":" · "+c);
      openModal(title,"🧮",reg.color,sub);
    };
  });
  // nested group pivot cells
  document.querySelectorAll('.ptable td.val[data-nested]').forEach(function(td){
    if(td.classList.contains("zero")) return;
    td.onclick=function(){
      var reg=window.__pivNested; if(!reg) return;
      var g=td.dataset.group, sv=td.dataset.solved, sm=td.dataset.svm, w=td.dataset.worker;
      var sub=reg.tickets.filter(function(t){
        if(g!=="__all__"&&t.group!==g) return false;
        if(sv!=="__all__"&&(t.isHD?"HD":"ENGG")!==sv) return false;
        if(sm!=="__all__"&&(t.svm||"(blank)")!==sm) return false;
        if(w!=="__all__"&&(t.currentWorker||"(blank)")!==w) return false;
        return true;
      });
      var parts=[]; if(g!=="__all__")parts.push(g); if(sv!=="__all__")parts.push(sv); if(sm!=="__all__")parts.push(sm); if(w!=="__all__")parts.push("worker "+w);
      openModal(parts.join(" · ")||"All clarification tickets","🧮","#0F766E",sub);
    };
  });
}
function bindMain(){
  // sort headers
  document.querySelectorAll("th[data-sort]").forEach(function(h){
    h.onclick=function(){
      var c=h.dataset.sort;
      if(S.sortCol===c) S.sortDir=S.sortDir==="asc"?"desc":"asc";
      else { S.sortCol=c; S.sortDir="desc"; }
      renderMain();
    };
  });
  bindPivotCells();

  if(S.tab==="perf"){
    var f=filtered();
    var hd=f.filter(function(t){return t.isHD;});
    var eg=f.filter(function(t){return !t.isHD;});
    // hero track
    var ht=el("heroTrack");
    if(ht){ ht.querySelectorAll(".seg").forEach(function(s){ s.onclick=function(){ s.dataset.side==="hd"?openModal("HD resolved","🟢","#0F766E",hd):openModal("Engg resolved","🟣","#5B57D8",eg); }; }); }
    // KPIs
    document.querySelectorAll("[data-kpi]").forEach(function(c){
      c.onclick=function(){
        var k=c.dataset.kpi;
        if(k==="all")openModal("All tickets in scope","📦","#111A2B",f);
        else if(k==="hd")openModal("HD resolved","🟢","#0F766E",hd);
        else if(k==="eg")openModal("Engg resolved","🟣","#5B57D8",eg);
        else if(k==="closed")openModal("Closed tickets","✅","#334155",f.filter(function(t){return t.status==="Closed";}));
        else if(k==="inc")openModal("Incidents","🔺","#B45309",f.filter(function(t){return t.issue==="Incident";}));
        else if(k==="srq")openModal("Service Requests","📨","#334155",f.filter(function(t){return t.issue==="Service Request";}));
      };
    });
    // root cause bars
    document.querySelectorAll(".barrow[data-rc]").forEach(function(b){
      b.onclick=function(){ var rc=b.dataset.rc; openModal('Root cause: '+rc,"🏷️","#0F766E",f.filter(function(t){return (t.rc||"(blank)")===rc;})); };
    });
    // monthly bars
    document.querySelectorAll(".mbars .bar[data-month]").forEach(function(b){
      b.onclick=function(){
        var k=b.dataset.month, side=b.dataset.side;
        var tix=f.filter(function(t){return bucketMonth(t)===k && (side==="hd"?t.isHD:!t.isHD);});
        openModal(mLabel(k)+" · "+(side==="hd"?"HD":"Engg")+" resolved","📈",side==="hd"?"#0F766E":"#5B57D8",tix);
      };
    });
    // svm rows
    document.querySelectorAll("tr.rowlink[data-svm]").forEach(function(r){
      r.onclick=function(){ var s=r.dataset.svm; openModal(s+" — all tickets in scope","👤","#0F766E",f.filter(function(t){return (t.svm||"(unassigned)")===s;})); };
    });
  }

  if(S.tab==="trend"){
    el("tRc").onchange=function(e){ S.tRc=e.target.value; renderMain(); };
    el("tStatus").onchange=function(e){ S.tStatus=e.target.value; renderMain(); };
    // toggle mode buttons
    document.querySelectorAll(".tmode-btn").forEach(function(b){
      b.onclick=function(){ S.tMode=b.dataset.tmode; renderMain(); };
    });
    // rebuild scope to resolve clicks
    var base=RAW.filter(function(t){ if(!inRange(t))return false; if(S.svm&&t.svm!==S.svm)return false; if(S.cw&&t.currentWorker!==S.cw)return false; if(S.issue&&t.issue!==S.issue)return false; return true; });
    function scopeFn(t){
      if(S.tRc==="__CLAR__"){ if(!isClar(t.rc))return false; } else if(S.tRc!=="__ALL__"){ if(t.rc!==S.tRc)return false; }
      if(S.tStatus==="Closed"){ if(t.status!=="Closed")return false; } else if(S.tStatus!=="__ALL__"){ if(t.status!==S.tStatus)return false; }
      return true;
    }
    var scope=base.filter(scopeFn);
    // card segment clicks — support both month and worker modes
    document.querySelectorAll(".mcard .seg[data-mk]").forEach(function(s){
      s.onclick=function(){
        var k=s.dataset.mk, side=s.dataset.side;
        var tix;
        if(S.tMode==="month"){
          tix=scope.filter(function(t){return bucketMonth(t)===k && (side==="hd"?t.isHD:!t.isHD);});
          openModal(mLabel(k)+" · "+(side==="hd"?"HD closed":"Engg")+" clarification","📈",side==="hd"?"#0F766E":"#5B57D8",tix);
        }else{
          tix=scope.filter(function(t){return (t.currentWorker||"(unassigned)")===k && (side==="hd"?t.isHD:!t.isHD);});
          openModal(k+" · "+(side==="hd"?"HD closed":"Engg"),"👤",side==="hd"?"#0F766E":"#5B57D8",tix);
        }
      };
    });
    // line chart dots + tooltip (only present in month mode)
    var tip=el("lctip");
    document.querySelectorAll(".lc-dot").forEach(function(d){
      d.addEventListener("mousemove",function(ev){
        if(!tip)return; var box=d.closest(".linechart").getBoundingClientRect();
        tip.style.left=(ev.clientX-box.left)+"px"; tip.style.top=(ev.clientY-box.top)+"px";
        tip.innerHTML=(d.dataset.lc==="hd"?"HD":"Engg")+" <span class='mono'>"+d.dataset.p+"%</span> · "+mLabel(d.dataset.mk);
        tip.style.opacity="1";
      });
      d.addEventListener("mouseleave",function(){ if(tip)tip.style.opacity="0"; });
      d.onclick=function(){
        var k=d.dataset.mk, side=d.dataset.lc;
        var tix=scope.filter(function(t){return bucketMonth(t)===k && (side==="hd"?t.isHD:!t.isHD);});
        openModal(mLabel(k)+" · "+(side==="hd"?"HD":"Engg")+" ("+d.dataset.p+"%)","📈",side==="hd"?"#0F766E":"#5B57D8",tix);
      };
    });
  }

  if(S.tab==="pivots"){
    document.querySelectorAll("[data-piv-nav]").forEach(function(b){ b.onclick=function(){ S.pivot=b.dataset.pivNav; renderMain(); }; });
    var cpR=el("cpRow"); if(cpR) cpR.onchange=function(e){ S.cpRow=e.target.value; renderMain(); };
    var cpC=el("cpCol"); if(cpC) cpC.onchange=function(e){ S.cpCol=e.target.value; renderMain(); };
  }

  if(S.tab==="wow"){
    var wk=window.__wk||{};
    var sa=el("weekA"); if(sa) sa.onchange=function(e){ S.weekA=e.target.value; renderMain(); };
    var sb=el("weekB"); if(sb) sb.onchange=function(e){ S.weekB=e.target.value; renderMain(); };
    // window presets
    document.querySelectorAll("[data-wowset]").forEach(function(b){
      b.onclick=function(){ var ks=Object.keys(window.__wk||{}).sort(); if(!ks.length) return;
        if(b.dataset.wowset==="all"){ S.weekA=ks[0]; S.weekB=ks[ks.length-1]; }
        else { S.weekA=ks.length>1?ks[ks.length-2]:ks[ks.length-1]; S.weekB=ks[ks.length-1]; }
        renderMain();
      };
    });
    // compare cards → week B tickets
    document.querySelectorAll("[data-wcard]").forEach(function(c){
      c.onclick=function(){
        var w=wk[S.weekB]; if(!w) return; var side=c.dataset.wcard;
        var tix = side==="hd"?w.tix.filter(function(t){return t.isHD;}) : side==="eg"?w.tix.filter(function(t){return !t.isHD;}) : w.tix;
        var sfx = side==="hd"?" · HD":side==="eg"?" · Engg":"";
        openModal(weekLabel(S.weekB)+" ("+weekDates(w.year,w.week)+") resolved"+sfx,"🗓️", side==="eg"?"#5B57D8":"#0F766E", tix);
      };
    });
    // trend bar segments
    document.querySelectorAll(".stackwrap .seg[data-wk]").forEach(function(s){
      s.onclick=function(){ var w=wk[s.dataset.wk]; if(!w) return; var side=s.dataset.side;
        var tix=side==="hd"?w.tix.filter(function(t){return t.isHD;}):w.tix.filter(function(t){return !t.isHD;});
        openModal(weekLabel(w.key)+" · "+(side==="hd"?"HD":"Engg")+" resolved","🗓️",side==="hd"?"#0F766E":"#5B57D8",tix);
      };
    });
    // detail table HD/Engg/total cells
    document.querySelectorAll("td.val[data-wkc]").forEach(function(td){
      td.onclick=function(ev){ ev.stopPropagation(); var w=wk[td.dataset.wkc]; if(!w) return; var side=td.dataset.side;
        var tix=side==="hd"?w.tix.filter(function(t){return t.isHD;}):side==="eg"?w.tix.filter(function(t){return !t.isHD;}):w.tix;
        var sfx=side==="hd"?" · HD":side==="eg"?" · Engg":"";
        openModal(weekLabel(w.key)+" resolved"+sfx,"🗓️",side==="eg"?"#5B57D8":"#0F766E",tix);
      };
    });
    // whole-row → week tickets
    document.querySelectorAll("tr.rowlink[data-wk-row]").forEach(function(r){
      r.onclick=function(){ var w=wk[r.dataset.wkRow]; if(!w) return; openModal(weekLabel(w.key)+" ("+weekDates(w.year,w.week)+") · all resolved","🗓️","#0F766E",w.tix); };
    });
  }

  if(S.tab==="exc"){
    document.querySelectorAll("[data-exc]").forEach(function(c){
      c.onclick=function(){ S._excFilter = (S._excFilter===c.dataset.exc)? null : c.dataset.exc; renderMain(); };
    });
    var clr=el("excClear"); if(clr) clr.onclick=function(){ S._excFilter=null; renderMain(); };
    var csv=el("excCsv"); if(csv) csv.onclick=function(){ exportCSV(window.__excList||[],"exceptions"); };
  }
}

/* ═══════════════════════════════ UPLOAD FLOW ═══════════════════════════════ */
function handleUpload(e){
  var file=e.target.files&&e.target.files[0]; if(!file) return;
  FILENAME=file.name;
  var btn=el("uploadBtn"); if(btn){ btn.textContent="Reading…"; btn.disabled=true; }
  readFile(file).then(function(rows){
    RAW=normalize(rows).filter(function(t){return t.key;});
    // reset view state on new upload
    S.svm=""; S.cw=""; S.rc=""; S.issue=""; S.from=""; S.to=""; S.dlabel="All time"; S._excFilter=null;
    S.tab="perf"; S.tRc="__CLAR__"; S.tStatus="Closed"; S.pivot="hdworker"; S.weekA=""; S.weekB=""; S.sortCol="total"; S.sortDir="desc";
    render();
    // footer
  }).catch(function(err){ alert("Could not read file: "+err.message); if(btn){btn.textContent="Upload Jira Excel";btn.disabled=false;} });
  e.target.value="";
}

function renderLanding(){
  el("app").innerHTML=''+
  '<div class="landing">'+
    '<div class="deco b1"></div><div class="deco b2"></div>'+
    '<div class="deco ring r1"></div><div class="deco ring r2"></div>'+
    '<div class="landing-card up">'+
      '<div class="brand-mark">'+
        '<span class="bar"><i style="height:16px;background:var(--hd)"></i><i style="height:32px;background:var(--hd2)"></i><i style="height:12px;background:var(--engg2)"></i><i style="height:26px;background:var(--engg)"></i></span>'+
        '<span style="font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.4px">HD Ticket Trend Tracker</span>'+
      '</div>'+
      '<p style="color:var(--ink2);font-size:13px;margin:-6px 0 22px;line-height:1.6">Upload your Jira export to see, month by month and person by person, how much the Help Desk resolved on its own versus escalating to Engineering.</p>'+
      '<div class="upload-panel">'+
        '<div class="dz" id="dz">'+
          '<div style="font-size:34px;margin-bottom:8px">📊</div>'+
          '<div style="font-family:var(--disp);font-weight:600;font-size:15px;margin-bottom:4px">Drop your Jira Excel here</div>'+
          '<div class="sub" style="margin-bottom:16px">.xlsx exported from Jira · any size · the whole file is read in your browser</div>'+
          '<button class="btn-primary" id="uploadBtn">Choose Excel file</button>'+
        '</div>'+
        '<div style="margin-top:18px;text-align:left">'+
          '<div class="eyebrow" style="margin-bottom:8px">Columns the dashboard reads</div>'+
          '<div class="hint-cols">'+
            ["Issue Type","Key","Summary","SVM In Charge","Root Cause","Status","Components","Linked Issues","Solved BY","Created","Resolved"].map(function(c){return '<span>'+c+'</span>';}).join("")+
          '</div>'+
          '<div class="sub" style="margin-top:12px;line-height:1.6"><b style="color:var(--hd)">HD</b> vs <b style="color:var(--engg)">ENGG</b> is read from <b>Solved BY</b>; a value in <b>Linked Issues</b> confirms an Engineering escalation. Next month, upload the same-format file — everything recalculates automatically.</div>'+
        '</div>'+
      '</div>'+
      '<input type="file" id="fileinput" accept=".xlsx,.xls">'+
    '</div>'+
  '</div>';
  var fi=el("fileinput");
  el("uploadBtn").onclick=function(){ fi.click(); };
  el("dz").onclick=function(){ fi.click(); };
  fi.onchange=handleUpload;
  var dz=el("dz");
  ["dragenter","dragover"].forEach(function(ev){ dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add("over");}); });
  ["dragleave","drop"].forEach(function(ev){ dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove("over");}); });
  dz.addEventListener("drop",function(e){
    var file=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(file){ FILENAME=file.name; readFile(file).then(function(rows){ RAW=normalize(rows).filter(function(t){return t.key;}); S.tab="perf"; render(); }).catch(function(err){alert("Could not read file: "+err.message);}); }
  });
}

/* footer appended after each render */
var _origRenderMain=renderMain;
renderMain=function(){
  _origRenderMain();
  var main=el("main"); if(!main)return;
  var fdiv=document.createElement("div"); fdiv.className="footer";
  var inRangeCount=RAW.filter(inRange).length;
  fdiv.innerHTML='<b>'+esc(FILENAME)+'</b> · '+RAW.length.toLocaleString()+' tickets loaded'+((S.from||S.to)?' · '+inRangeCount.toLocaleString()+' in range':'')+' · HD Ticket Trend Tracker';
  main.appendChild(fdiv);
};

/* boot — load the shared Excel uploaded on the launcher (index.html) */
function boot(){
  if(!window.HDStore){ renderLanding(); return; }
  HDStore.loadFile().then(function(rec){
    if(!rec){ window.location.replace("index.html"); return; }
    FILENAME=rec.name;
    readFile(rec.blob).then(function(rows){
      RAW=normalize(rows).filter(function(t){return t.key;});
      render();
    }).catch(function(err){ alert("Could not read stored file: "+err.message); window.location.replace("index.html"); });
  });
}
boot();
</script>
